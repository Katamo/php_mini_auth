<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{project_name}}</title>
<style>{{css}}</style>
<style>
.login__input-wrap { position: relative; }
.login__input-wrap .login__input { padding-right: 2.4rem; }
.login__toggle-pass {
  position: absolute; right: 0.55rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 0.25rem;
  color: var(--color-muted); display: flex; align-items: center; line-height: 0;
}
.login__toggle-pass:hover { color: var(--color-fg); }
</style>
</head>
<body>
<div class="login">
  <div class="login__card">
    <p class="login__title">{{project_name}}</p>
    <p class="login__subtitle">{{subtitle}}</p>
    <form id="form" class="login__form">
      <div class="login__field">
        <label class="login__label" for="u">usuario</label>
        <input class="login__input" id="u" name="{{session_key}}_u" type="text" autocomplete="username" autofocus />
      </div>
      <div class="login__field">
        <label class="login__label" for="p">contraseña</label>
        <div class="login__input-wrap">
          <input class="login__input" id="p" name="{{session_key}}_p" type="password" autocomplete="current-password" />
          <button class="login__toggle-pass" type="button" id="toggle-pass" aria-label="Mostrar contraseña">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <p class="login__error" id="err"></p>
      <button class="login__submit" type="submit" id="btn">entrar</button>
    </form>
  </div>
</div>
<script>
const form = document.getElementById('form');
const err  = document.getElementById('err');
const btn  = document.getElementById('btn');
const redirect = new URLSearchParams(location.search).get('redirect') || '/';

form.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = '…';
  const username = document.getElementById('u').value.trim();
  const password = document.getElementById('p').value;
  try {
    const res  = await fetch('login.php', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (res.ok && data.success) {
      location.href = redirect;
    } else {
      err.textContent = data.error || 'Credenciales incorrectas';
      btn.disabled = false;
      btn.textContent = 'entrar';
    }
  } catch {
    err.textContent = 'Error de conexión';
    btn.disabled = false;
    btn.textContent = 'entrar';
  }
});

const SVG_EYE     = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const SVG_EYE_OFF = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

document.getElementById('toggle-pass').addEventListener('click', function () {
  const input   = document.getElementById('p');
  const visible = input.type === 'text';
  input.type     = visible ? 'password' : 'text';
  this.innerHTML = visible ? SVG_EYE : SVG_EYE_OFF;
  this.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
});
</script>
</body>
</html>
